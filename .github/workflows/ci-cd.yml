name: CI/CD Pipeline - Docker, Tests & Security

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: auy1102-pipeline

jobs:
  docker-build-and-test:
    name: Docker Build & Unit Tests in Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test Docker image (builder stage)
        run: docker build --target builder -t ${{ env.IMAGE_NAME }}:test .

      - name: Run unit tests inside Docker container
        run: docker run --rm ${{ env.IMAGE_NAME }}:test npm run test:unit

      - name: Build production Docker image
        run: docker build --target production -t ${{ env.IMAGE_NAME }}:prod .

  sonarcloud:
    name: SonarCloud Static Analysis & Quality Gate
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        env:
          NPM_TOKEN: ''
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: SonarCloud Scan (fails on Quality Gate)
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  snyk:
    name: Snyk Static & Dependency Security Analysis
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        env:
          NPM_TOKEN: ''
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk Dependency Scan (fail on critical)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=critical

      - name: Snyk Code Static Analysis (fail on critical)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --severity-threshold=critical

  ghas-security:
    name: GitHub Advanced Security (Dependencies & Secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dependency Review (PR dependency analysis)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical

      - name: Secret Scanning in Pipeline (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-scout:
    name: Docker Scout Vulnerability Scan
    needs: [docker-build-and-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production image for scanning
        run: docker build --target production -t ${{ env.IMAGE_NAME }}:scan .

      - name: Login to Docker Hub (required for Docker Scout)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Scan image with Docker Scout (fail on critical)
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ env.IMAGE_NAME }}:scan
          only-severities: critical
          exit-code: true

  publish-dockerhub:
    name: Publish Docker Image to Docker Hub
    needs:
      - docker-build-and-test
      - docker-scout
      - ghas-security
      - sonarcloud
      - snyk
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
